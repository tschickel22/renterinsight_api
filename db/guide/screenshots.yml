# Help article screenshots (backlog E89), loaded on staging by
# Guide::ScreenshotLoader whenever this file changes. Nobody takes these by
# hand: the nightly run (scripts/screenshot-capture.cjs in the frontend repo)
# plays each recipe in the Summit Park demo company at desktop and phone size.
#
#   key:      lowercase words joined by dashes; the article line is {{shot: key}}
#   route:    the page to open
#   crop:     a data-tour marker, or css:selector (css:main is the page without
#             the menu and header); empty takes the whole screen
#   steps:    done first, in order: {click: marker}, {fill: marker, value: text},
#             {wait: ms}, {highlight: marker} (an orange ring round it)
#   mask:     CSS selectors that change daily, left out of the comparison
#   articles: where the shot goes: the article's slug, and the heading whose
#             paragraph it follows (the first paragraph when there is none)
#
# The file wins for the keys it names. A shot is added to an article only
# when the article does not show it yet, so moving the line by hand sticks.

