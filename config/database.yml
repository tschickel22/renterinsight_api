# PostgreSQL configuration for all environments
# Ensures dev, staging, and production use the same database engine
#
# Local development: Use DATABASE_URL env var or default connection
# Staging/Production: Render provides DATABASE_URL automatically

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
  timeout: 5000

development:
  <<: *default
  database: ri_dms_dev
  # If using Docker Postgres locally:
  # Set DATABASE_URL in .env file
  # Example: DATABASE_URL=postgres://postgres:postgres@localhost:5432/ri_dms_dev
  url: <%= ENV['DATABASE_URL'] %>

test:
  <<: *default
  database: ri_dms_test
  url: <%= ENV['DATABASE_URL']&.gsub('ri_dms_dev', 'ri_dms_test') || 'postgres://postgres:postgres@localhost:5432/ri_dms_test' %>

staging:
  <<: *default
  # Render provides DATABASE_URL automatically.
  # Solid Queue tables live in this DB (see db/migrate/*install_solid_queue*).
  url: <%= ENV['DATABASE_URL'] %>

production:
  <<: *default
  # Render provides DATABASE_URL automatically.
  # Solid Queue tables live in this DB (see db/migrate/*install_solid_queue*).
  url: <%= ENV['DATABASE_URL'] %>
