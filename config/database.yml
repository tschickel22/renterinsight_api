# PostgreSQL configuration for all environments
# Ensures dev, staging, and production use the same database engine
#
# Local development: Use DATABASE_URL env var or default connection
# Staging/Production: Render provides DATABASE_URL automatically

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
  timeout: 5000

development:
  <<: *default
  database: ri_dms_dev
  # If using Docker Postgres locally:
  # Set DATABASE_URL in .env file
  # Example: DATABASE_URL=postgres://postgres:postgres@localhost:5432/ri_dms_dev
  url: <%= ENV['DATABASE_URL'] %>

test:
  <<: *default
  database: ri_dms_test
  url: <%= ENV['DATABASE_URL']&.gsub('ri_dms_dev', 'ri_dms_test') || 'postgres://postgres:postgres@localhost:5432/ri_dms_test' %>

staging:
  primary:
    <<: *default
    # Render provides DATABASE_URL automatically
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *default
    database: ri_dms_staging_cache
    url: <%= ENV['CACHE_DATABASE_URL'] || ENV['DATABASE_URL']&.gsub(/\/[^\/]+$/, '/ri_dms_staging_cache') %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: ri_dms_staging_queue
    url: <%= ENV['QUEUE_DATABASE_URL'] || ENV['DATABASE_URL']&.gsub(/\/[^\/]+$/, '/ri_dms_staging_queue') %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: ri_dms_staging_cable
    url: <%= ENV['CABLE_DATABASE_URL'] || ENV['DATABASE_URL']&.gsub(/\/[^\/]+$/, '/ri_dms_staging_cable') %>
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    # Render provides DATABASE_URL automatically
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *default
    database: ri_dms_production_cache
    url: <%= ENV['CACHE_DATABASE_URL'] || ENV['DATABASE_URL']&.gsub(/\/[^\/]+$/, '/ri_dms_production_cache') %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: ri_dms_production_queue
    url: <%= ENV['QUEUE_DATABASE_URL'] || ENV['DATABASE_URL']&.gsub(/\/[^\/]+$/, '/ri_dms_production_queue') %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: ri_dms_production_cable
    url: <%= ENV['CABLE_DATABASE_URL'] || ENV['DATABASE_URL']&.gsub(/\/[^\/]+$/, '/ri_dms_production_cable') %>
    migrations_paths: db/cable_migrate
