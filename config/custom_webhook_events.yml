# Webhook Events Configuration
# All available webhook events organized by category
# IMPORTANT: Events here MUST match WebhookService::EVENTS exactly.
# Events not in WebhookService::EVENTS will never fire, even if listed here.
# NOTE: Only add events here once they are actually wired up in the codebase.

events:
  # ── CRM Events ──
  - value: contact.created
    label: Contact Created
    category: CRM Events
  - value: contact.updated
    label: Contact Updated
    category: CRM Events
  - value: contact.deleted
    label: Contact Deleted
    category: CRM Events

