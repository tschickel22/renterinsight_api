# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

default: &default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  workflow_cron_dispatcher:
    class: WorkflowCronDispatcherJob
    schedule: every minute
  workflow_resume_waiting:
    class: ResumeWaitingWorkflowRunsJob
    schedule: every minute
  workflow_retention:
    class: WorkflowRetentionJob
    schedule: every sunday at 3am
  champion_ims_weekly_sync:
    class: ChampionImsWeeklySyncJob
    schedule: every sunday at 2am
  # These times are UTC — config.time_zone is not set, so Rails (and therefore
  # SolidQueue's recurring schedule) runs in UTC.
  #
  # Catalog crawls are meant to land overnight Mountain, well clear of the
  # working day when dealers get subscribed and catalogs added: a subscription
  # enqueues its own run, and two runs on one source can overlap.
  # "1am" meant 7pm Denver in summer and 6pm in winter, i.e. the middle of that
  # window. 8am UTC is 2am MDT / 1am MST, which is inside the intended window
  # year round without having to change the app's timezone.
  catalog_nightly_sync:
    class: CatalogNightlySyncJob
    queue: default
    schedule: every day at 8am
  champion_lead_sync:
    class: ChampionLeadSyncJob
    queue: default
    schedule: every 15 minutes
  generate_scheduled_social_posts:
    class: GenerateScheduledSocialPostsJob
    schedule: every hour
  sync_social_post_metrics:
    class: SyncSocialPostMetricsJob
    schedule: every day at 3am
  purge_stale_social_drafts:
    class: PurgeStaleSocialDraftsJob
    queue: default
    schedule: every day at 3:30am
  vehicle_days_on_lot_check:
    class: VehicleDaysOnLotCheckJob
    schedule: every day at 4am
  publish_due_social_posts:
    class: PublishDueSocialPostsJob
    queue: default
    schedule: every 5 minutes
  sync_ad_spend:
    class: SyncAdSpendJob
    queue: default
    schedule: every day at 3am
  sync_social_comments:
    class: SyncSocialCommentsJob
    queue: default
    schedule: every 15 minutes
  campaign_scheduler:
    class: CampaignSchedulerJob
    queue: default
    schedule: every 5 minutes
  campaign_goal_checker:
    class: CampaignGoalCheckJob
    queue: default
    schedule: every 10 minutes
  campaign_stats_rollup:
    class: CampaignStatsRollupJob
    queue: default
    schedule: every 15 minutes
  floor_plan_daily_accrual:
    class: FloorPlanAccrualJob
    queue: default
    schedule: every day at 6am
  send_ai_digest:
    class: SendAiDigestJob
    queue: default
    schedule: every monday at 7am
  notification_reminders:
    class: NotificationRemindersJob
    queue: default
    schedule: every hour
  sync_all_users_sent_emails:
    class: SyncAllUsersSentEmailsJob
    queue: default
    schedule: every 10 minutes
  send_activity_reminders:
    # Fires bell/email reminders for lead/contact/account/deal activities
    # when reminder_time is coming up in the next 5 minutes. Was never
    # scheduled before this — every reminder set on a lead/contact/account/
    # deal was silently dropped, discovered after cody@evangelinehomecenter
    # missed a Fire Marshal follow-up reminder on Deal 328.
    class: SendActivityRemindersJob
    queue: default
    schedule: every minute
  harvest_campaign_bounces:
    # Reads sending mailboxes' Inbox for NDR bounces + out-of-office replies.
    # Campaigns send from owners' Gmail/Outlook, so these land in the sender's
    # mailbox and never reach the reply+campaign-<id>@ inbound webhook.
    # Feeds Campaigns::BounceHandler (stamps bounced_at, suppresses, flags email_invalid).
    class: HarvestCampaignBouncesJob
    queue: default
    schedule: every 10 minutes
  refresh_ses_domain_status:
    # Polls SES for tenant sending domains awaiting DKIM verification, so a domain whose
    # DNS records propagate overnight is verified without the tenant coming back to press
    # a button. SES is the only authority on verification.
    class: RefreshSesDomainStatusJob
    queue: default
    schedule: every 15 minutes
  refresh_website_domain_status:
    # Polls Cloudflare for custom hostname and certificate status. Issuance happens on
    # Cloudflare's schedule after DNS is correct, and nothing else notices, so without this
    # a dealer's site can be live while the screen says pending until someone presses a
    # button they have no reason to know about.
    class: RefreshWebsiteDomainStatusJob
    queue: default
    schedule: every 10 minutes

production:
  <<: *default

staging:
  <<: *default
